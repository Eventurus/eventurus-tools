<style>
:root{--c-text:#2c2c2c;--c-muted:#888;--c-brand:#5A6E55;--c-bg:#F9F9F9;--c-surface:#fff;--c-border:#E5E5E0;--c-gold:#CBA866;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--c-bg);color:var(--c-text);font-size:16px;line-height:1.6}
.container{max-width:800px;margin:0 auto;padding:0 20px}
.brand-bar{padding:24px 0 0;text-align:center}
.brand-bar .brand{font-size:18px;font-weight:500;letter-spacing:2px;color:var(--c-text);text-decoration:none}
.brand-bar .brand em{font-style:normal;color:var(--c-text)}
.brand-bar .tagline{font-size:12px;color:var(--c-muted);letter-spacing:1px}
.back-link{display:inline-block;margin:12px 0 0;font-size:13px;color:var(--c-brand);text-decoration:none}
.hero{text-align:center;padding:36px 0 20px}
.hero h1{font-size:28px;font-weight:600;margin-bottom:4px}
.hero p{font-size:14px;color:var(--c-muted)}
.section{margin-bottom:24px}
.section h2{font-size:18px;font-weight:600;margin-bottom:12px}
.section h2 span{color:var(--c-brand)}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{background:var(--c-surface);border:2px solid var(--c-border);border-radius:50px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--c-brand)}
.filter-btn.on{border-color:var(--c-brand);background:#F0F6EC;color:var(--c-brand);font-weight:600}
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.filter-row .label{font-size:13px;color:var(--c-muted);white-space:nowrap;min-width:60px}
.day-pill{background:var(--c-surface);border:2px solid var(--c-border);border-radius:50px;padding:6px 14px;font-size:13px;cursor:pointer;transition:all .15s}
.day-pill:hover{border-color:var(--c-brand)}
.day-pill.on{border-color:var(--c-brand);background:#F0F6EC;color:var(--c-brand);font-weight:600}
.city-pill{background:var(--c-surface);border:2px solid var(--c-border);border-radius:50px;padding:6px 12px;font-size:12px;cursor:pointer;transition:all .15s}
.city-pill:hover{border-color:var(--c-brand)}
.city-pill.on{border-color:var(--c-brand);background:#F0F6EC;color:var(--c-brand);font-weight:600}
.results-count{font-size:13px;color:var(--c-muted);margin-bottom:12px}
.dest-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.dest-card.featured{border-color:var(--c-gold);border-width:2px;background:#FFFDF7}
.dest-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.dest-name{font-size:20px;font-weight:600}
.dest-name .cn{font-size:14px;color:var(--c-muted);font-weight:400;margin-left:6px}
.dest-tags{display:flex;gap:6px;flex-wrap:wrap}
.dest-tag{font-size:11px;padding:3px 10px;border-radius:50px;font-weight:500}
.dest-tag.nature{background:#EAF3DE;color:#3B6D11}
.dest-tag.culture{background:#EEEDFE;color:#534AB7}
.dest-tag.food{background:#FFF0E0;color:#A06600}
.dest-tag.wellness{background:#D6F0EE;color:#1A7A72}
.dest-tag.family{background:#FFE8E8;color:#B33}
.dest-tag.adventure{background:#E6F1FB;color:#185FA5}
.dest-tag.season{background:#F5E8D5;color:#8A6A3A}
.dest-story{font-size:14px;line-height:1.7;color:var(--c-text);margin-bottom:14px}
.dest-story i{font-style:italic;color:var(--c-brand)}
.attractions{margin-bottom:14px}
.attractions .att-title{font-size:13px;font-weight:600;color:var(--c-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.attr-item{background:var(--c-bg);border-radius:8px;padding:10px 12px}
.attr-item .attr-name{font-size:14px;font-weight:600;margin-bottom:2px}
.attr-item .attr-desc{font-size:12px;color:var(--c-muted);line-height:1.4}
.dest-info{display:flex;gap:20px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--c-border);font-size:13px;color:var(--c-muted)}
.dest-info span{display:flex;align-items:center;gap:4px}
.dest-info .best-time{color:var(--c-brand);font-weight:500}
.match-bar{display:flex;align-items:center;gap:8px;font-size:13px}
.match-bar .m-pct{font-weight:700;color:var(--c-brand)}
.match-bar .m-bar{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden;max-width:120px}
.match-bar .m-fill{height:100%;background:var(--c-brand);border-radius:3px}
.site-footer{text-align:center;padding:40px 0 28px;font-size:12px;color:var(--c-muted)}
.site-footer a{color:var(--c-brand);text-decoration:none}
.site-footer .brand-foot{font-style:italic;font-size:14px;color:var(--c-text);letter-spacing:1px;margin-bottom:4px}
@media(max-width:600px){.attr-grid{grid-template-columns:1fr}.dest-header{flex-direction:column}}
  img { opacity:0.85; }
}
</style>
</head>
<body>
<div class="brand-bar">
  <a href="index.html" class="brand">EVENT<em>URUS</em></a>
  <div class="tagline">China, Vetted.</div>
  <a href="index.html" class="back-link">← All tools</a>
</div>
<div class="container">
<div class="hero">
  <h1>Where to Go in China</h1>
  <p>Filter by what you love — we'll show you where. Each destination is vetted, written from experience, and updated for the current season.</p>
</div>

<div class="section">
  <div class="filter-row"><span class="label">Interest:</span><div class="filter-bar" id="tagBar"></div></div>
  <div class="filter-row"><span class="label">Trip length:</span><div class="filter-bar" id="dayBar"></div></div>
  <div class="filter-row"><span class="label">Season:</span><div class="filter-bar" id="seasonBar"></div></div>
</div>

<div class="results-count" id="resultsCount"></div>
<div id="destList"></div>

<div class="site-footer">
  <div class="brand-foot">EVENTURUS · VETTED</div>
  <div><a href="https://eventurus.cn">eventurus.cn</a></div>
</div>
</div>


<footer style="text-align:center;padding:32px 16px 24px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;color:#999;line-height:1.8;margin-top:40px;">
<a href="https://beian.miit.gov.cn" target="_blank" rel="noopener noreferrer" style="color:#999;text-decoration:none;letter-spacing:.3px;transition:color .2s;" onmouseover="this.style.color='#666'" onmouseout="this.style.color='#999'">赣ICP备2026012265号-1</a>
</footer>

<button id="backToTop" aria-label="Back to top" style="position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:100;transition:opacity .2s;">↑</button>


<script>
(function() {
  var btt = document.getElementById('backToTop');
  if (btt) {
    window.addEventListener('scroll', function() {
      btt.style.display = window.scrollY > 300 ? 'flex' : 'none';
    });
    btt.addEventListener('click', function() {
      window.scrollTo({top:0,behavior:'smooth'});
    });
  }
})();
</script>
</body>
</html>
