<style>
:root {
  --color-text: #2c2c2c;
  --color-text-muted: #888780;
  --color-brand: #5A6E55;
  --color-brand-light: #E3EFD5;

  --font-sans: 'Inter', -apple-system, Helvetica, Arial, sans-serif;

}

* { margin: 0; padding: 0; box-sizing: border-box; }
:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; border-radius: 4px; }

body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

/* Brand */
.brand-bar {
  padding: 24px 0 0;
  text-align: center;
}
.brand-bar .brand {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 2px;
  color: var(--color-text);
  text-decoration: underline; text-underline-offset: 2px;
}
.brand-bar .brand em {font-style:normal; color:var(--color-text); }
.brand-bar .tagline { font-size: 12px; color: var(--color-text-muted); letter-spacing: 1px; margin-top: 2px; }

/* Hero */
.hero {
  text-align: center;
  padding: 40px 0 24px;
}
.hero h1 {
  font-size: 32px;
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 8px;
}
.hero p {
  font-size: 15px;
  color: var(--color-text-muted);
  max-width: 480px;
  margin: 0 auto 16px;
}

/* Print/Share controls */
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.controls button {
  padding: 10px 24px;
  border-radius: 24px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  font-size: 14px;
  font-family: var(--font-sans);
  cursor: pointer;
  color: var(--color-text);
  transition: all 0.2s;
}
.controls button:hover {
  border-color: var(--color-brand);
  color: var(--color-brand);
}
.controls .btn-primary {
  background: var(--color-brand);
  color: #fff;
  border-color: var(--color-brand);
}
.controls .btn-primary:hover {
  background: #5a6e55;
}

/* Category filter */
.cat-filter {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.cat-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  font-size: 13px;
  font-family: var(--font-sans);
  cursor: pointer;
  color: var(--color-text-muted);
  transition: all 0.2s;
}
.cat-btn.active {
  background: var(--color-brand);
  color: #fff;
  border-color: var(--color-brand);
}
.cat-btn:hover:not(.active) {
  border-color: var(--color-brand);
  color: var(--color-brand);
}

/* Card grid */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 32px;
}
@media (max-width: 600px) {
  .card-grid { grid-template-columns: 1fr; }
}

/* Individual card */
.phrase-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  padding: 24px 20px;
  position: relative;
  transition: box-shadow 0.2s;
  cursor: default;
  break-inside: avoid;
}
.phrase-card:hover {
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.phrase-card .cat-tag {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--color-brand-light);
  color: var(--color-brand);
}
.phrase-card .zh {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 4px;
  line-height: 1.3;
}
.phrase-card .pinyin {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-bottom: 8px;
  font-style: italic;
}
.phrase-card .en {
  font-size: 14px;
  color: var(--color-text);
  line-height: 1.4;
}
.phrase-card .en em {
  font-style: italic;
  color: var(--color-text-muted);
}
.phrase-card .icon {
  font-size: 28px;
  margin-bottom: 8px;
}

/* Print-specific styles */
@media print {
  @page { margin: 10mm; }
  body { background: #fff; }
  .controls, .cat-filter, .brand-bar, .site-footer { display: none; }
  .hero { padding-top: 0; }
  .hero h1 { font-size: 24px; }
  .card-grid { gap: 12px; margin-bottom: 0; }
  .phrase-card {
    border: 1px solid #ddd;
    box-shadow: none;
    page-break-inside: avoid;
    padding: 16px;
  }
  .phrase-card:hover { box-shadow: none; }
  .phrase-card .cat-tag { background: #eee; }
  .phrase-card .zh { font-size: 20px; }
}

/* Footer */
.site-footer {
  text-align: center;
  padding: 32px 0 28px;
  font-size: 12px;
  color: var(--color-text-muted);
}
.site-footer a { color: var(--color-brand); text-decoration: underline; text-underline-offset: 2px; }
.site-footer .brand-foot {
  font-style: italic;
  font-size: 14px;
  color: var(--color-text);
  letter-spacing: 1px;
  margin-bottom: 4px;
}

/* Dark mode */
a { color: var(--color-brand); text-decoration: underline; text-underline-offset: 2px; }
.info-card a, .cross-link a { text-decoration: underline; text-underline-offset: 2px; }

<script>
const CARDS = [
  // TAXI

  { cat:'taxi', icon:'&#128661;', zh:'打表吗？', pinyin:'Da biao ma?', en:'Do you use the meter?', note:'Always ask before starting the ride' },
  { cat:'taxi', icon:'&#128661;', zh:'我要去机场。', pinyin:'Wo yao qu ji chang.', en:'I need to go to the airport.' },
  { cat:'taxi', icon:'&#128661;', zh:'我要去火车站。', pinyin:'Wo yao qu huo che zhan.', en:'I need to go to the train station.' },
  { cat:'taxi', icon:'&#128661;', zh:'在这里停就可以。', pinyin:'Zai zhe li ting jiu ke yi.', en:'You can stop here.' },
  { cat:'taxi', icon:'&#128661;', zh:'多少钱？', pinyin:'Duo shao qian?', en:'How much?', note:'Check before paying' },

  // DINING
  { cat:'dining', icon:'&#127860;', zh:'我吃素，不要肉。', pinyin:'Wo chi su, bu yao rou.', en:'I\'m vegetarian, no meat please.' },
  { cat:'dining', icon:'&#127860;', zh:'我不吃辣。', pinyin:'Wo bu chi la.', en:'I don\'t eat spicy food.' },
  { cat:'dining', icon:'&#127860;', zh:'我对花生过敏。', pinyin:'Wo dui hua sheng guo min.', en:'I\'m allergic to peanuts.' },
  { cat:'dining', icon:'&#127860;', zh:'有英文菜单吗？', pinyin:'You ying wen cai dan ma?', en:'Do you have an English menu?', note:'Many tourist-friendly restaurants do' },
  { cat:'dining', icon:'&#127860;', zh:'买单，谢谢。', pinyin:'Mai dan, xie xie.', en:'Check, please.' },
  { cat:'dining', icon:'&#127860;', zh:'不要味精。', pinyin:'Bu yao wei jing.', en:'No MSG, please.' },
  { cat:'dining', icon:'&#127860;', zh:'请问有什么推荐的菜？', pinyin:'Qing wen you shen me tui jian de cai?', en:'What do you recommend?' },
  { cat:'dining', icon:'&#127860;', zh:'我要打包。', pinyin:'Wo yao da bao.', en:'I\'d like to take this to go.' },

  // HOTEL
  { cat:'hotel', icon:'&#127976;', zh:'我有预订。', pinyin:'Wo you yu ding.', en:'I have a reservation.' },
  { cat:'hotel', icon:'&#127976;', zh:'我要办理入住。', pinyin:'Wo yao ban li ru zhu.', en:'I\'d like to check in.' },
  { cat:'hotel', icon:'&#127976;', zh:'我的房间号是___。', pinyin:'Wo de fang jian hao shi ___.', en:'My room number is ___.' },
  { cat:'hotel', icon:'&#127976;', zh:'有Wi-Fi吗？密码是多少？', pinyin:'You Wi-Fi ma? Mi ma shi duo shao?', en:'Is there Wi-Fi? What\'s the password?' },
  { cat:'hotel', icon:'&#127976;', zh:'请帮我叫一辆出租车。', pinyin:'Qing bang wo jiao yi liang chu zu che.', en:'Please call a taxi for me.' },
  { cat:'hotel', icon:'&#127976;', zh:'早餐几点开始？', pinyin:'Zao can ji dian kai shi?', en:'What time does breakfast start?' },
  { cat:'hotel', icon:'&#127976;', zh:'我需要多一条毛巾。', pinyin:'Wo xu yao duo yi tiao mao jin.', en:'I need an extra towel.' },

  // MEDICAL
  { cat:'medical', icon:'&#127973;', zh:'我生病了。', pinyin:'Wo sheng bing le.', en:'I\'m sick.' },
  { cat:'medical', icon:'&#127973;', zh:'带我去最近的医院。', pinyin:'Dai wo qu zui jin de yi yuan.', en:'Take me to the nearest hospital.' },
  { cat:'medical', icon:'&#127973;', zh:'我发烧了。', pinyin:'Wo fa shao le.', en:'I have a fever.' },

  // SHOPPING
  { cat:'shopping', icon:'&#128722;', zh:'这个多少钱？', pinyin:'Zhe ge duo shao qian?', en:'How much is this?' },
  { cat:'shopping', icon:'&#128722;', zh:'太贵了，能便宜点吗？', pinyin:'Tai gui le, neng pian yi dian ma?', en:'Too expensive. Can you make it cheaper?', note:'Bargaining is common at markets' },
  { cat:'shopping', icon:'&#128722;', zh:'可以刷卡吗？', pinyin:'Ke yi shua ka ma?', en:'Can I pay by card?' },
  { cat:'shopping', icon:'&#128722;', zh:'我可以试穿吗？', pinyin:'Wo ke yi shi chuan ma?', en:'Can I try this on?' },

  // BASIC
  { cat:'basic', icon:'&#128172;', zh:'你好。谢谢。再见。', pinyin:'Ni hao. Xie xie. Zai jian.', en:'Hello. Thank you. Goodbye.', note:'The three most useful words' },
  { cat:'basic', icon:'&#128172;', zh:'对不起 / 不好意思。', pinyin:'Dui bu qi / Bu hao yi si.', en:'Sorry / Excuse me.' },
  { cat:'basic', icon:'&#128172;', zh:'厕所在哪里？', pinyin:'Ce suo zai na li?', en:'Where is the restroom?' },
  { cat:'basic', icon:'&#128172;', zh:'我不会中文。', pinyin:'Wo bu hui zhong wen.', en:'I don\'t speak Chinese.', note:'Said with a smile, it usually helps' },
  { cat:'basic', icon:'&#128172;', zh:'请说慢一点。', pinyin:'Qing shuo man yi dian.', en:'Please speak slower.' },
  { cat:'basic', icon:'&#128172;', zh:'这个用中文怎么说？', pinyin:'Zhe ge yong zhong wen zen me shuo?', en:'How do you say this in Chinese?' },
  { cat:'basic', icon:'&#128172;', zh:'我迷路了。', pinyin:'Wo mi lu le.', en:'I\'m lost.' },
];

function renderCards(filter) {
  const grid = document.getElementById('cardGrid');
  const filtered = filter === 'all' ? CARDS : CARDS.filter(c => c.cat === filter);
  grid.innerHTML = filtered.map(c => `
    <div class="phrase-card">
      <span class="cat-tag">${c.cat}</span>
      <div class="icon">${c.icon}</div>
      <div class="zh">${c.zh}</div>
      <div class="pinyin">${c.pinyin}</div>
      <div class="en">${c.en}${c.note ? ' <em>&mdash; ' + c.note + '</em>' : ''}</div>
    </div>
  `).join('');
}

function filterCards(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards(cat);
}

function selectAllText() {
  // A more user-friendly approach: copy all cards text to clipboard
  const text = CARDS.map(c => c.zh + ' (' + c.en + ')').join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.controls button:last-child');
    btn.textContent = '&#10003; Copied!';
    setTimeout(() => btn.textContent = '&#128203; Select all', 2000);
  });
}

renderCards('all');
</script>
