<style>
:root {
  --color-text: #2c2c2c;
  --color-text-muted: #888780;
  --color-brand: #5A6E55;
  --color-brand-light: #E3EFD5;
  --color-bg: #F9F9F9;
  --color-surface: #ffffff;
  --color-border: #E5E5E0;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'Inter', -apple-system, Helvetica, Arial, sans-serif;
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
:focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; border-radius: 4px; }


body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

/* Brand */
.brand-bar {
  padding: 24px 0 0;
  text-align: center;
}
.brand-bar .brand {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 2px;
  color: var(--color-text);
  text-decoration: underline; text-underline-offset: 2px;
}
.brand-bar .brand em {font-style:normal; color:var(--color-text); }
.brand-bar .tagline { font-size: 12px; color: var(--color-text-muted); letter-spacing: 1px; margin-top: 2px; }

/* Hero */
.hero {
  text-align: center;
  padding: 40px 0 24px;
}
.hero h1 {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 8px;
}
.hero p {
  font-size: 15px;
  color: var(--color-text-muted);
  max-width: 480px;
  margin: 0 auto 16px;
}

/* Print/Share controls */
.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.controls button {
  padding: 10px 24px;
  border-radius: 24px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  font-size: 14px;
  font-family: var(--font-sans);
  cursor: pointer;
  color: var(--color-text);
  transition: all 0.2s;
}
.controls button:hover {
  border-color: var(--color-brand);
  color: var(--color-brand);
}
.controls .btn-primary {
  background: var(--color-brand);
  color: #fff;
  border-color: var(--color-brand);
}
.controls .btn-primary:hover {
  background: #5a6e55;
}

/* Category filter */
.cat-filter {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.cat-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  font-size: 13px;
  font-family: var(--font-sans);
  cursor: pointer;
  color: var(--color-text-muted);
  transition: all 0.2s;
}
.cat-btn.active {
  background: var(--color-brand);
  color: #fff;
  border-color: var(--color-brand);
}
.cat-btn:hover:not(.active) {
  border-color: var(--color-brand);
  color: var(--color-brand);
}

/* Card grid */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 32px;
}
@media (max-width: 600px) {
  .card-grid { grid-template-columns: 1fr; }
}

/* Individual card */
.phrase-card {
  background: var(--color-surface);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  padding: 24px 20px;
  position: relative;
  transition: box-shadow 0.2s;
  cursor: default;
  break-inside: avoid;
}
.phrase-card:hover {
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.phrase-card .cat-tag {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--color-brand-light);
  color: var(--color-brand);
}
.phrase-card .zh {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 4px;
  line-height: 1.3;
}
.phrase-card .pinyin {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-bottom: 8px;
  font-style: italic;
}
.phrase-card .en {
  font-size: 14px;
  color: var(--color-text);
  line-height: 1.4;
}
.phrase-card .en em {
  font-style: italic;
  color: var(--color-text-muted);
}
.phrase-card .icon {
  font-size: 28px;
  margin-bottom: 8px;
}

/* Print-specific styles */
@media print {
  @page { margin: 10mm; }
  body { background: #fff; }
  .controls, .cat-filter, .brand-bar, .site-footer { display: none; }
  .hero { padding-top: 0; }
  .hero h1 { font-size: 24px; }
  .card-grid { gap: 12px; margin-bottom: 0; }
  .phrase-card {
    border: 1px solid #ddd;
    box-shadow: none;
    page-break-inside: avoid;
    padding: 16px;
  }
  .phrase-card:hover { box-shadow: none; }
  .phrase-card .cat-tag { background: #eee; }
  .phrase-card .zh { font-size: 20px; }
}

/* Footer */
.site-footer {
  text-align: center;
  padding: 32px 0 28px;
  font-size: 12px;
  color: var(--color-text-muted);
}
.site-footer a { color: var(--color-brand); text-decoration: underline; text-underline-offset: 2px; }
.site-footer .brand-foot {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14px;
  color: var(--color-text);
  letter-spacing: 1px;
  margin-bottom: 4px;
}

/* Dark mode */
a { color: var(--color-brand); text-decoration: underline; text-underline-offset: 2px; }
.info-card a, .cross-link a { text-decoration: underline; text-underline-offset: 2px; }
  img { opacity: 0.85; }
}
